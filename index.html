<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>清记</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="笔记软件">
      <aside class="sidebar" aria-label="笔记列表">
        <header class="sidebar-header">
          <div>
            <p class="eyebrow">Notes</p>
            <h1>清记</h1>
          </div>
          <button class="icon-button primary" id="addNoteButton" type="button" title="新建笔记" aria-label="新建笔记">
            +
          </button>
        </header>

        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题或内容" autocomplete="off" />
        </label>

        <nav class="note-list" id="noteList" aria-label="全部笔记"></nav>

        <div class="sidebar-footer">
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="切换到深色模式"
            aria-pressed="false"
          >
            <span class="theme-toggle-icon" aria-hidden="true">☾</span>
            <span class="theme-toggle-label">深色模式</span>
            <span class="theme-toggle-switch" aria-hidden="true">
              <span class="theme-toggle-knob"></span>
            </span>
          </button>
        </div>
      </aside>

      <section class="editor" aria-label="笔记内容">
        <div class="editor-empty" id="emptyState" hidden>
          <h2>选择或新建一条笔记</h2>
          <p>左侧列表用于管理笔记，右侧用于编辑内容。</p>
        </div>

        <article class="editor-panel" id="editorPanel">
          <div class="editor-toolbar">
            <div class="saved-state" id="savedState" aria-live="polite">已保存</div>
            <button class="text-button danger" id="deleteNoteButton" type="button">删除</button>
          </div>

          <label class="field-label" for="noteTitle">标题</label>
          <input class="title-input" id="noteTitle" type="text" maxlength="80" placeholder="未命名笔记" />

          <label class="field-label" for="noteContent">内容</label>
          <textarea class="content-input" id="noteContent" placeholder="记录想法、待办或会议要点"></textarea>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
